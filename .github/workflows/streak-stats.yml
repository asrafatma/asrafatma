name: Update GitHub Streak Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: DenverCoder1/github-readme-streak-stats@main
        with:
          github_user_id: ${{ github.repository_owner }}
          theme: dracula
          hide_border: false
          output_filepath: docs/streak.svg
      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/streak.svg
          git commit -m "Update streak stats image" || exit 0
          git push